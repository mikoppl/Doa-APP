name: Build APK
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - run: npm install
      - run: npm install @capacitor/haptics@^6
      - run: pip install pillow
      - run: npx cap add android
      - name: Pasang logo, splash, dan izin getar
        run: |
          python3 - <<'PY'
          from PIL import Image, ImageDraw, ImageOps
          import math, glob, os
          RES = 'android/app/src/main/res'
          N = 2048
          k = N / 100
          L = Image.new('RGBA', (N, N), (0, 0, 0, 0))
          d = ImageDraw.Draw(L)
          for i in range(36):
              a = 2 * math.pi * i / 36
              x = (50 + 31 * math.cos(a)) * k
              y = (50 + 31 * math.sin(a)) * k
              r = 1.15 * k
              d.ellipse((x - r, y - r, x + r, y + r), fill=(255, 255, 255, 105))
          m = Image.new('L', (N, N), 0)
          md = ImageDraw.Draw(m)
          md.ellipse((32 * k, 36 * k, 65 * k, 69 * k), fill=255)
          md.ellipse((42.3 * k, 33.8 * k, 70.7 * k, 62.2 * k), fill=0)
          g = ImageOps.colorize(Image.linear_gradient('L').resize((N, N)), (241, 211, 126), (201, 162, 75)).convert('RGBA')
          L.paste(g, (0, 0), m)
          pts = [(59.5, 36.2), (60.8, 39.7), (64.3, 41), (60.8, 42.3), (59.5, 45.8), (58.2, 42.3), (54.7, 41), (58.2, 39.7)]
          d.polygon([(x * k, y * k) for x, y in pts], fill=(241, 211, 126, 255))
          v = Image.linear_gradient('L').resize((N, N))
          h = Image.linear_gradient('L').rotate(90).resize((N, N))
          B = ImageOps.colorize(Image.blend(v, h, .5), (11, 74, 63), (28, 138, 115)).convert('RGBA')
          full = B.copy(); full.alpha_composite(L)
          def rounded(im, n, circle):
              im = im.resize((n, n), Image.LANCZOS)
              mk = Image.new('L', (n * 4, n * 4), 0)
              dd = ImageDraw.Draw(mk)
              if circle: dd.ellipse((0, 0, n * 4 - 1, n * 4 - 1), fill=255)
              else: dd.rounded_rectangle((0, 0, n * 4 - 1, n * 4 - 1), radius=int(n * 4 * .22), fill=255)
              im.putalpha(mk.resize((n, n), Image.LANCZOS))
              return im
          for dens, leg, ada in (('mdpi', 48, 108), ('hdpi', 72, 162), ('xhdpi', 96, 216), ('xxhdpi', 144, 324), ('xxxhdpi', 192, 432)):
              p = RES + '/mipmap-' + dens + '/'
              rounded(full, leg, False).save(p + 'ic_launcher.png')
              rounded(full, leg, True).save(p + 'ic_launcher_round.png')
              L.resize((ada, ada), Image.LANCZOS).save(p + 'ic_launcher_foreground.png')
              B.resize((ada, ada), Image.LANCZOS).save(p + 'ic_launcher_bg.png')
          for nm in ('ic_launcher', 'ic_launcher_round'):
              open(RES + '/mipmap-anydpi-v26/' + nm + '.xml', 'w').write('<?xml version="1.0" encoding="utf-8"?>\n<adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">\n    <background android:drawable="@mipmap/ic_launcher_bg"/>\n    <foreground android:drawable="@mipmap/ic_launcher_foreground"/>\n</adaptive-icon>\n')
          n = 0
          for f in glob.glob(RES + '/drawable*/splash.png'):
              w, hh = Image.open(f).size
              s = B.resize((w, hh), Image.LANCZOS)
              z = int(min(w, hh) * .45)
              s.alpha_composite(L.resize((z, z), Image.LANCZOS), ((w - z) // 2, (hh - z) // 2))
              s.convert('RGB').save(f); n += 1
          mf = 'android/app/src/main/AndroidManifest.xml'
          t = open(mf).read()
          if 'android.permission.VIBRATE' not in t:
              t = t.replace('</manifest>', '    <uses-permission android:name="android.permission.VIBRATE" />\n</manifest>')
              open(mf, 'w').write(t)
          print('LOGO DAN SPLASH TERPASANG; splash:', n, '; getar:', 'VIBRATE' in open(mf).read())
          PY
      - run: npx cap sync android
      - run: cd android && chmod +x gradlew && ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: Doa-Sehari-hari-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
